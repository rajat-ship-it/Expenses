<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#4f46e5;--gr:#15803d;--rd:#b91c1c;--am:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef1;--mu:#9aa1ac;--bd:#2c3038;--ac:#8b85ff;--gr:#4ade80;--rd:#f87171;--am:#fbbf24}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef1;--mu:#9aa1ac;--bd:#2c3038;--ac:#8b85ff;--gr:#4ade80;--rd:#f87171;--am:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bal{border:1px solid var(--bd);border-radius:12px;padding:10px}.bal small,.mu{color:var(--mu);font-size:12px}.bal b{display:block;font-size:19px}
.tot{font-size:26px;font-weight:700}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:4px 8px;width:auto;font-size:12px;font-weight:400}
button.o{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg label{flex:1;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:14px}
.seg label.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}.seg input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{border:1px solid var(--bd);border-radius:20px;padding:5px 11px;cursor:pointer;font-size:13px}
.day{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}.dh{display:flex;justify-content:space-between;gap:8px}
.e{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}.e:last-child{border:0}
.out{color:var(--rd)}.in{color:var(--gr)}.pill{font-size:11px;border:1px solid var(--bd);border-radius:20px;padding:1px 7px;color:var(--mu);margin-left:4px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px 2px;font-size:13px}.tabs button.on{background:var(--ac);color:#fff}
.done{opacity:.5;text-decoration:line-through}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
.warn{border-color:var(--am);color:var(--am)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;z-index:50}
#toast button{width:auto;background:transparent;color:#a5b4fc;padding:0 4px}
.fx .card{animation:up .3s ease both}.fx .card:nth-child(2){animation-delay:.05s}.fx .card:nth-child(3){animation-delay:.1s}.fx .card:nth-child(n+4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button,.chip,.seg label{transition:transform .1s,background .15s,color .15s,border-color .15s}
button:active,.chip:active,.seg label:active{transform:scale(.96)}
.e.new{animation:flash 1.4s ease}@keyframes flash{from{background:color-mix(in srgb,var(--ac) 30%,transparent)}to{background:transparent}}
.bar i{transform-origin:left;animation:grow .6s ease both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#toast{animation:up .25s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><h1>💰 Expense Tracker</h1><div id="app"></div></main>
<div id="toast"><span id="tm"></span><button id="tu">Undo</button></div>
<script>
var CATS=['Bus','Train','Food','Chai','Recharge','Fuel','Shopping','Other'];
var S={open:{upi:0,cash:0},tx:[],debts:[],budget:0,created:Date.now(),lastBackup:0};
var UI={kind:'out',mode:'upi',cat:'',dir:'owed',tab:'log',edit:null,settle:null,fx:1,flash:null,q:'',fm:'',fmo:'',sm:today().slice(0,7)};
var store=null,saveT=null,undoFn=null,toastT=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem('exp_tracker',JSON.stringify(S))}catch(e){}
  if(!store)return;clearTimeout(saveT);saveT=setTimeout(function(){store.set({s:JSON.stringify(S)}).catch(function(){})},400)}
function toast(m,fn){$('tm').textContent=m;undoFn=fn;$('toast').style.display='flex';clearTimeout(toastT);toastT=setTimeout(function(){$('toast').style.display='none';undoFn=null},6000)}
$('tu').addEventListener('click',function(){if(undoFn){undoFn();undoFn=null}$('toast').style.display='none'});
function eff(b,t){if(t.kind==='xf'){var o=t.mode==='upi'?'cash':'upi';b[t.mode]-=t.amt;b[o]+=t.amt}else b[t.mode]+=(t.kind==='in'?1:-1)*t.amt}
function balances(){var b={upi:+S.open.upi||0,cash:+S.open.cash||0};S.tx.forEach(function(t){eff(b,t)});return b}
function render(fresh){
  var keep={};if(!fresh)document.querySelectorAll('#app input[id],#app select[id]').forEach(function(x){keep[x.id]=x.value});
  var b=balances(),om=0,io=0;S.debts.forEach(function(d){if(!d.done){if(d.dir==='owed')om+=d.amt;else io+=d.amt}});
  var h='<div class="card"><div class="mu">Total balance</div><div class="tot">'+inr(b.upi+b.cash)+'</div><div class="grid"><div class="bal"><small>UPI</small><b>'+inr(b.upi)+'</b></div><div class="bal"><small>Cash</small><b>'+inr(b.cash)+'</b></div><div class="bal"><small>People owe me</small><b class="in">'+inr(om)+'</b></div><div class="bal"><small>I owe</small><b class="out">'+inr(io)+'</b></div></div></div>';
  if(S.tx.length&&Date.now()-(S.lastBackup||S.created)>6048e5)h+='<div class="card warn"><b>Backup reminder</b><div class="mu" style="color:inherit">No backup in over a week. Your data lives only on this phone.</div><div style="margin-top:8px"><button data-act="exp">Export backup now</button></div></div>';
  var T=[['log','Log'],['debts','Owed'],['sum','Summary'],['set','Settings']];
  h+='<div class="tabs">'+T.map(function(t){return'<button class="'+(UI.tab===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
  h+=UI.tab==='log'?logView():UI.tab==='debts'?debtView():UI.tab==='sum'?sumView():setView();
  $('app').innerHTML=h;$('app').className=UI.fx?'fx':'';UI.fx=0;
  for(var k in keep){var y=$(k);if(y)y.value=keep[k]}
  if(UI.tab==='log'){$('fm').value=UI.fm;$('dl').innerHTML=dayList()}
  UI.flash=null;countTot(b.upi+b.cash);
}
var lastTot=null;
function countTot(n){var el=document.querySelector('.tot');if(!el)return;var from=lastTot;lastTot=n;if(from===null||from===n)return;var t0=performance.now();(function f(t){var p=Math.min((t-t0)/450,1),e=1-Math.pow(1-p,3);el.textContent=inr(Math.round((from+(n-from)*e)*100)/100);if(p<1)requestAnimationFrame(f)})(t0)}
function seg(g,opts,cur){return'<div class="seg" data-grp="'+g+'">'+opts.map(function(o){return'<label data-v="'+o[0]+'" class="'+(cur===o[0]?'on':'')+'"><input type="radio">'+o[1]+'</label>'}).join('')+'</div>'}
function logView(){
  var E=UI.edit&&S.tx.filter(function(t){return t.id===UI.edit})[0];
  var h='<div class="card"><h2>'+(E?'Edit entry':'Add entry')+'</h2>'+seg('kind',[['out','Spent'],['in','Received'],['xf','Transfer']],UI.kind)
   +(UI.kind==='xf'?seg('mode',[['upi','UPI → Cash'],['cash','Cash → UPI']],UI.mode):seg('mode',[['upi','UPI'],['cash','Cash']],UI.mode));
  if(UI.kind==='out')h+='<div class="chips">'+CATS.map(function(c){return'<span class="chip '+(UI.cat===c?'on':'')+'" data-cat="'+c+'">'+c+'</span>'}).join('')+'</div>';
  h+='<div class="row"><input id="tA" type="number" inputmode="decimal" placeholder="Amount ₹" value="'+(E?E.amt:'')+'"><input id="tD" type="date" value="'+(E?E.date:today())+'"></div>'
   +'<div class="row"><input id="tR" placeholder="'+(UI.kind==='xf'?'Note (e.g. ATM withdrawal)':'Reason (bus ticket, train ticket, food...)')+'" value="'+(E?esc(E.reason||''):'')+'"></div>'
   +'<div class="row"><button data-act="addtx">'+(E?'Save changes':'Add entry')+'</button>'+(E?'<button class="o" data-act="canc">Cancel</button>':'')+'</div></div>';
  h+='<div class="card"><h2>Day by day</h2><div class="row"><input id="fq" placeholder="Search reason" value="'+esc(UI.q)+'"><select id="fm"><option value="">All</option><option value="upi">UPI</option><option value="cash">Cash</option></select></div><div class="row"><input id="fmo" type="month" value="'+UI.fmo+'"></div><div id="dl"></div></div>';
  return h;
}
function dayList(){
  var days={};S.tx.forEach(function(t){(days[t.date]=days[t.date]||[]).push(t)});
  var dates=Object.keys(days).sort(),run={upi:+S.open.upi||0,cash:+S.open.cash||0},info={};
  dates.forEach(function(d){var sp={upi:0,cash:0},ic=0;days[d].forEach(function(t){if(t.kind==='out')sp[t.mode]+=t.amt;else if(t.kind==='in')ic+=t.amt;eff(run,t)});info[d]={sp:sp,ic:ic,c:{upi:run.upi,cash:run.cash}}});
  var q=UI.q.toLowerCase(),out='';
  dates.slice().reverse().forEach(function(d){
    if(UI.fmo&&d.slice(0,7)!==UI.fmo)return;
    var l=days[d].filter(function(t){return(!UI.fm||t.mode===UI.fm)&&(!q||((t.reason||'')+' '+(t.cat||'')).toLowerCase().indexOf(q)>=0)});
    if(!l.length)return;
    var i=info[d],sp=i.sp.upi+i.sp.cash,net=i.ic-sp;
    out+='<div class="day"><div class="dh"><b>'+fmtDate(d)+'</b><span class="'+(net<0?'out':'in')+'">'+(net<0?'▼ ':'▲ ')+inr(net)+'</span></div><div class="mu">Spent '+inr(sp)+' (UPI '+inr(i.sp.upi)+' · Cash '+inr(i.sp.cash)+')'+(i.ic?' · Received '+inr(i.ic):'')+'</div>';
    l.forEach(function(t){
      var xf=t.kind==='xf',tag=xf?(t.mode==='upi'?'UPI → Cash':'Cash → UPI'):(t.mode==='upi'?'UPI':'Cash');
      out+='<div class="e'+(t.id===UI.flash?' new':'')+'"><span>'+esc(t.reason||(xf?'Transfer':'-'))+'<span class="pill">'+tag+'</span></span><span><b class="'+(xf?'':t.kind==='in'?'in':'out')+'">'+(xf?'':t.kind==='in'?'+':'-')+inr(t.amt)+'</b> <button class="g" data-ed="'+t.id+'">✎</button> <button class="g" data-del="'+t.id+'">✕</button></span></div>';
    });
    out+='<div class="mu" style="margin-top:6px">End of day: <b>'+inr(i.c.upi+i.c.cash)+'</b> (UPI '+inr(i.c.upi)+' · Cash '+inr(i.c.cash)+')</div></div>';
  });
  return out||'<p class="mu">No entries to show.</p>';
}
function debtView(){
  var h='';
  if(UI.settle){var d=S.debts.filter(function(x){return x.id===UI.settle})[0];if(d)h+='<div class="card"><h2>Settle '+inr(d.amt)+' with '+esc(d.person)+'</h2><p class="mu">'+(d.dir==='owed'?'They paid you':'You paid them')+' through:</p><div class="row"><button data-sm="upi">UPI</button><button data-sm="cash">Cash</button></div><div class="row"><button class="o" data-sm="none">No money moved</button><button class="o" data-sm="x">Cancel</button></div></div>'}
  h+='<div class="card"><h2>Add</h2>'+seg('dir',[['owed','They owe me'],['owe','I owe them']],UI.dir)+'<div class="row"><input id="dP" placeholder="Person name"><input id="dA" type="number" inputmode="decimal" placeholder="Amount ₹"></div><div class="row"><input id="dN" placeholder="Note (optional)"></div><button data-act="adddebt">Add</button></div>';
  [['owed','People owe me','in'],['owe','I owe','out']].forEach(function(g){
    var l=S.debts.filter(function(d){return d.dir===g[0]});h+='<div class="card"><h2>'+g[1]+'</h2>';
    if(!l.length)h+='<p class="mu">Nothing here.</p>';
    l.forEach(function(d){h+='<div class="e"><span class="'+(d.done?'done':'')+'"><b>'+esc(d.person)+'</b>'+(d.note?'<br><span class="mu">'+esc(d.note)+'</span>':'')+'</span><span><b class="'+g[2]+(d.done?' done':'')+'">'+inr(d.amt)+'</b> <button class="g" data-done="'+d.id+'">'+(d.done?'Undo':'Settled')+'</button> <button class="g" data-deld="'+d.id+'">✕</button></span></div>'});
    h+='</div>'});
  return h;
}
function sumView(){
  var m=UI.sm,by={},sp=0,rc=0,u=0,c=0;
  S.tx.forEach(function(t){if(t.date.slice(0,7)!==m)return;if(t.kind==='out'){var k=t.cat||'Other';by[k]=(by[k]||0)+t.amt;sp+=t.amt;if(t.mode==='upi')u+=t.amt;else c+=t.amt}else if(t.kind==='in')rc+=t.amt});
  var h='<div class="card"><h2>Monthly summary</h2><div class="row"><input id="sm" type="month" value="'+m+'"></div><div class="tot">'+inr(sp)+'</div><div class="mu">spent (UPI '+inr(u)+' · Cash '+inr(c)+')'+(rc?' · received '+inr(rc):'')+'</div>';
  if(S.budget>0){var p=sp/S.budget*100;h+='<div style="margin-top:12px"><b>Budget '+inr(S.budget)+'</b> · '+(sp>S.budget?'<span class="out">over by '+inr(sp-S.budget)+'</span>':inr(S.budget-sp)+' left')+'<div class="bar"><i style="width:'+Math.min(p,100)+'%;background:'+(p>100?'var(--rd)':p>80?'var(--am)':'var(--ac)')+'"></i></div>'+(p>100?'<div class="out">You are over budget.</div>':p>80?'<div style="color:var(--am)">Careful: over 80% of budget used.</div>':'')+'</div>'}
  else h+='<p class="mu">Set a monthly budget in Settings to see progress here.</p>';
  h+='</div><div class="card"><h2>By category</h2>';
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(!ks.length)h+='<p class="mu">No spending this month.</p>';
  ks.forEach(function(k){h+='<div class="dh"><span>'+esc(k)+'</span><b>'+inr(by[k])+'</b></div><div class="bar"><i style="width:'+by[k]/sp*100+'%"></i></div>'});
  return h+'</div>';
}
function setView(){
  var p=hasPin();
  return '<div class="card"><h2>Opening balance</h2><p class="mu">Money you had before you started tracking.</p><div class="row"><input id="oU" type="number" inputmode="decimal" placeholder="UPI ₹" value="'+(S.open.upi||'')+'"><input id="oC" type="number" inputmode="decimal" placeholder="Cash ₹" value="'+(S.open.cash||'')+'"></div><button data-act="saveopen">Save</button></div>'
   +'<div class="card"><h2>Monthly budget</h2><div class="row"><input id="bg" type="number" inputmode="decimal" placeholder="₹ per month (0 = none)" value="'+(S.budget||'')+'"></div><button data-act="savebg">Save budget</button></div>'
   +'<div class="card"><h2>PIN lock</h2><p class="mu">Asks for a PIN when you open the app. Keeps out casual snooping only.</p><div class="row"><input id="pn" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN (4 to 8 digits)"></div><div class="row"><button data-act="setpin">'+(p?'Change PIN':'Set PIN')+'</button>'+(p?'<button class="g" data-act="rmpin">Remove PIN</button>':'')+'</div></div>'
   +'<div class="card"><h2>Backup and export</h2><p class="mu">'+(S.lastBackup?'Last backup: '+new Date(S.lastBackup).toLocaleDateString('en-IN'):'No backup yet.')+'</p><div class="row"><button data-act="exp">Export backup</button><button data-act="imp">Import backup</button></div><div class="row"><button class="o" data-act="csv">Export to Excel (CSV)</button></div><input id="impf" type="file" accept=".json" style="display:none"></div>';
}
async function dl(name,text,type){
  try{if(typeof claude!=='undefined'){var d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}}catch(e){}
  var u=URL.createObjectURL(new Blob([text],{type:type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
}
function csvq(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function mkcsv(){
  var r=[['Date','Type','Mode','Amount','Category','Reason']];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){r.push([t.date,t.kind==='out'?'Spent':t.kind==='in'?'Received':'Transfer',t.kind==='xf'?(t.mode==='upi'?'UPI to Cash':'Cash to UPI'):t.mode.toUpperCase(),t.amt,t.cat||'',t.reason||''])});
  r.push([]);r.push(['Person','Direction','Amount','Note','Settled']);
  S.debts.forEach(function(d){r.push([d.person,d.dir==='owed'?'Owes me':'I owe',d.amt,d.note||'',d.done?'Yes':'No'])});
  return r.map(function(x){return x.map(csvq).join(',')}).join('\n');
}
function h53(s){var a=0xdeadbeef,b=0x41c6ce57,c;for(var i=0;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
function pinH(p){return h53('exp|'+p)}
function hasPin(){try{return!!localStorage.getItem('exp_pin')}catch(e){return false}}
var L=document.createElement('div');L.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:none;z-index:99;align-items:center;justify-content:center;padding:20px';
L.innerHTML='<div class="card" style="width:100%;max-width:320px;text-align:center;margin:0"><h2>🔒 Enter PIN</h2><input id="lp" type="password" inputmode="numeric" maxlength="8" style="text-align:center;margin-bottom:8px"><div id="lm" class="mu" style="min-height:18px;margin-bottom:6px"></div><button id="lb">Unlock</button></div>';
document.body.appendChild(L);
function showLock(){L.style.display='flex';var p=$('lp');p.value='';$('lm').textContent='';setTimeout(function(){p.focus()},50)}
function tryUnlock(){var p=$('lp');if(pinH(p.value)===localStorage.getItem('exp_pin')){L.style.display='none';p.value=''}else{$('lm').textContent='Wrong PIN';p.value=''}}
$('lb').addEventListener('click',tryUnlock);$('lp').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});
var hidAt=0;document.addEventListener('visibilitychange',function(){if(document.hidden)hidAt=Date.now();else if(hasPin()&&hidAt&&Date.now()-hidAt>30000)showLock()});
if(hasPin())showLock();
function addTx(o){S.tx.push(o);return o}
$('app').addEventListener('input',function(e){
  if(e.target.id==='fq'){UI.q=e.target.value;$('dl').innerHTML=dayList()}
});
$('app').addEventListener('change',function(e){var i=e.target.id;
  if(i==='fm'){UI.fm=e.target.value;$('dl').innerHTML=dayList()}
  if(i==='fmo'){UI.fmo=e.target.value;$('dl').innerHTML=dayList()}
  if(i==='sm'&&e.target.value){UI.sm=e.target.value;render()}
  if(i==='impf'&&e.target.files[0]){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(adopt(o)){save();UI.tab='log';render(true)}else alert('Not a valid backup file')}catch(x){alert('Not a valid backup file')}};r.readAsText(e.target.files[0])}
});
$('app').addEventListener('click',function(e){
  var el=e.target.closest('[data-tab],[data-act],[data-del],[data-ed],[data-done],[data-deld],[data-sm],[data-cat],.seg label');if(!el)return;
  var D=el.dataset;
  if(D.tab){UI.tab=D.tab;UI.fx=1;render();return}
  if(D.cat){UI.cat=D.cat;var r=$('tR');if(r&&(!r.value||CATS.indexOf(r.value)>=0))r.value=D.cat;render();return}
  if(el.tagName==='LABEL'){var g=el.parentNode.dataset.grp;UI[g]=el.dataset.v;if(g==='kind'){UI.mode='upi';UI.cat=''}render();return}
  if(D.ed){var t=S.tx.filter(function(x){return x.id===D.ed})[0];if(t){UI.edit=t.id;UI.kind=t.kind;UI.mode=t.mode;UI.cat=t.kind==='out'?(t.cat||'Other'):'';UI.tab='log';render(true);window.scrollTo(0,0)}return}
  if(D.del){var i=S.tx.findIndex(function(x){return x.id===D.del}),it=S.tx[i];S.tx.splice(i,1);save();render();toast('Entry deleted',function(){S.tx.splice(i,0,it);save();render()});return}
  if(D.deld){var j=S.debts.findIndex(function(x){return x.id===D.deld}),dd=S.debts[j];S.debts.splice(j,1);save();render();toast('Deleted',function(){S.debts.splice(j,0,dd);save();render()});return}
  if(D.done){var d=S.debts.filter(function(x){return x.id===D.done})[0];
    if(d.done){if(d.txid)S.tx=S.tx.filter(function(x){return x.id!==d.txid});d.done=false;d.txid=null;save();render()}else{UI.settle=d.id;render()}return}
  if(D.sm){var s=S.debts.filter(function(x){return x.id===UI.settle})[0];UI.settle=null;
    if(s&&D.sm!=='x'){s.done=true;if(D.sm!=='none'){var t2=addTx({id:uid(),date:today(),kind:s.dir==='owed'?'in':'out',mode:D.sm,amt:s.amt,reason:(s.dir==='owed'?'Received from ':'Paid to ')+s.person,cat:s.dir==='owed'?'Income':'Other'});s.txid=t2.id}save()}
    render();return}
  var a=D.act;
  if(a==='canc'){UI.edit=null;UI.cat='';render(true)}
  if(a==='addtx'){var amt=+$('tA').value;if(!(amt>0)){$('tA').focus();return}
    var o={date:$('tD').value||today(),kind:UI.kind,mode:UI.mode,amt:amt,reason:$('tR').value.trim(),cat:UI.kind==='out'?(UI.cat||'Other'):UI.kind==='in'?'Income':'Transfer'};
    if(UI.edit){var ix=S.tx.findIndex(function(x){return x.id===UI.edit});o.id=UI.edit;if(ix>=0)S.tx[ix]=o;UI.edit=null}else{o.id=uid();S.tx.push(o)}
    UI.cat='';UI.flash=o.id;UI.fx=0;save();render(true)}
  if(a==='adddebt'){var p=$('dP').value.trim(),m=+$('dA').value;if(!p||!(m>0))return;S.debts.push({id:uid(),dir:UI.dir,person:p,amt:m,note:$('dN').value.trim(),done:false});save();render(true)}
  if(a==='saveopen'){S.open.upi=+$('oU').value||0;S.open.cash=+$('oC').value||0;save();UI.tab='log';render(true)}
  if(a==='savebg'){S.budget=+$('bg').value||0;save();UI.tab='sum';render(true)}
  if(a==='setpin'){var v=$('pn').value;if(!/^\d{4,8}$/.test(v)){alert('PIN must be 4 to 8 digits');return}localStorage.setItem('exp_pin',pinH(v));alert('PIN saved');render(true)}
  if(a==='rmpin'){localStorage.removeItem('exp_pin');render(true)}
  if(a==='exp'){S.lastBackup=Date.now();save();dl('expense-backup-'+today()+'.json',JSON.stringify(S),'application/json');render()}
  if(a==='imp'){$('impf').click()}
  if(a==='csv'){dl('expenses-'+today()+'.csv',mkcsv(),'text/csv')}
});
function adopt(o){if(o&&Array.isArray(o.tx)&&Array.isArray(o.debts)&&o.open){S=o;S.budget=+S.budget||0;S.created=S.created||Date.now();S.lastBackup=S.lastBackup||0;return true}return false}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
render(true);
(async function(){
  try{if(typeof claude==='undefined')throw 0;var db=await claude.use('db'),user=await claude.use('user');
    if(db&&user){var id=await user.id();store=db.doc('data/users/'+id+'/tracker/main');var snap=await store.get();
      if(snap.exists){try{adopt(JSON.parse(snap.data().s))}catch(e){}}
      else{try{adopt(JSON.parse(localStorage.getItem('exp_tracker')))}catch(e){}if(S.tx.length||S.debts.length)save()}
      render(true);return}}catch(e){}
  try{if(adopt(JSON.parse(localStorage.getItem('exp_tracker'))))render(true)}catch(e){}
})();
</script></body></html>
